# Minimal codebuddy-prism: the app builds from source, the compiler is the
# UNMODIFIED upstream Aldine image (a TeX Live wrapper whose version is its
# own: ALDINE_COMPILER_VERSION, plus ALDINE_TEXLIVE=-full for CJK). Everything
# else — auth/SSO/AI/email options, TLS, Postgres/Redis — lives in
# docker-compose.full.yml. Both files share the same project name and
# volumes, so you can switch between them without losing data.
name: codebuddy-prism

services:
  app:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        # CN builds: NPM_REGISTRY=https://registry.npmmirror.com and
        # NODE_IMAGE=docker.m.daocloud.io/library/node:22-alpine
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        NODE_IMAGE: ${NODE_IMAGE:-docker.io/library/node:22-alpine}
    image: codebuddy-prism-app:${PRISM_VERSION:-dev}
    ports:
      - "8080:3000"
    volumes:
      - aldine-data:/data
      - aldine-secrets:/secrets
    networks:
      - frontend
      - backend
    init: true # reap orphaned git/compile children (node runs as PID 1 otherwise)
    restart: unless-stopped

  compiler:
    image: ghcr.io/trahloff/aldine-compiler:${ALDINE_COMPILER_VERSION:-0.11.0}${ALDINE_TEXLIVE:-}
    volumes:
      - aldine-data:/data
    # Hardening: no external egress (internal network), drop all Linux caps, no
    # privilege escalation, bounded memory and PIDs. Packages are baked into the
    # image at build time, so the compiler never needs the network. LaTeX
    # processes untrusted input; keep these. (docker-compose.full.yml adds a CPU
    # cap on top; it is left out here because `cpus:` above the host's core
    # count makes the container refuse to start.)
    networks:
      - backend
    mem_limit: 2g
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    init: true # reap orphaned pdflatex/biber children left by killed latexmk runs
    restart: unless-stopped

networks:
  frontend: {}
  backend:
    internal: true # the compiler has no route to the internet

volumes:
  aldine-data:
  aldine-secrets:
